<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Reward Web App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 22px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .timer-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #eef2ff;
            border: 4px solid #4f46e5;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
        }
        .timer-text {
            font-size: 32px;
            font-weight: bold;
            color: #4f46e5;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-start {
            background-color: #4f46e5;
            color: white;
        }
        .btn-start:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .btn-claim {
            background-color: #10b981;
            color: white;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📺 অ্যাড ভিউ টাস্ক</h2>
        <p>অ্যাড দেখে রিওয়ার্ড নিতে নিচের কাউন্টডাউন শেষ হওয়া পর্যন্ত অপেক্ষা করুন।</p>
        
        <div class="timer-circle">
            <span class="timer-text" id="timer">15</span>
        </div>

        <button class="btn btn-start" id="waitBtn" disabled>অপেক্ষা করুন...</button>
        <button class="btn btn-claim" id="claimBtn" onclick="completeTask()">✅ অ্যাড দেখুন ও রিওয়ার্ড নিন</button>
    </div>

    <script>
        // Telegram WebApp Initialize
        const tg = window.Telegram.WebApp;
        tg.expand(); // Full screen open korbe

        let timeLeft = 15;
        const timerElem = document.getElementById("timer");
        const waitBtn = document.getElementById("waitBtn");
        const claimBtn = document.getElementById("claimBtn");

        // Countdown Timer Logic
        const countdown = setInterval(() => {
            timeLeft--;
            timerElem.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElem.innerText = "✓";
                waitBtn.style.display = "none";
                claimBtn.style.display = "block";
            }
        }, 1000);

        // Task Complete Function
        function completeTask() {
            // Smartlink/Ad Open Korbe
            window.open("https://asiafilm.org/4/4635667cbdb59c2d9ebb08f65b46883a", "_blank");
            
            // Bot-e confirmation data pathাবে
            tg.sendData("task_completed");
            
            // WebApp close kore dibe
            tg.close();
        }
    </script>
</body>
</html>
